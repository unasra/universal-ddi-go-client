        check_response_header_regexes:
        - regex: regex
          header: header
        - regex: regex
          header: header
        port: 6
        check_response_body_regex: check_response_body_regex
        name: name
        comment: comment
        disabled: true
        interval: 0
        https: true
        id: id
        retry_down: 1
        retry_up: 5
      properties:
        check_response_body:
          description: |-
            Optional. Flag which enables checking of the HTTP response body content.
            Defaults to _false_.
          format: boolean
          type: boolean
        check_response_body_negative:
          description: |-
            Optional. Flag which changes the meaning of the regex match result.
            If set to _true_, the response is valid if regular expression matches not found.
            Defaults to _false_.

            The flag is currently not supported.
          format: boolean
          type: boolean
        check_response_body_regex:
          description: |-
            Optional. Regular expression to search for a string in the HTTP response body.
            Error if empty while _check_response_body_ is _true_.
            Defaults to empty.
          type: string
        check_response_header:
          description: |-
            Optional. Flag which enables checking of the HTTP response header(s) content.
            Defaults to _false_.
          format: boolean
          type: boolean
        check_response_header_negative:
          description: |-
            Optional. Flag which changes the meaning of the header regexes match result.
            If set to _true_, neither expression matches must be found in their respective headers for the headers to be considered valid.
            Defaults to _false_.
          format: boolean
          type: boolean
        check_response_header_regexes:
          description: |-
            Optional. List of (header, regular expression) pairs.
            All expression matches must be found in their respective headers for the headers to be considered valid.
            Error if empty while _check_response_header_ is _true_.
            Defaults to empty.
          items:
            $ref: '#/components/schemas/dtcHeaderRegex'
          type: array
        codes:
          description: |-
            Optional. Response Status Codes meaning the health check is successful. If empty, any code means success.
            Individual codes and code ranges are supported, ex. "102,105-107,109-110,120".
          type: string
        comment:
          description: Optional. Comment for __HTTPHealthCheck__.
          type: string
        disabled:
          description: |-
            Optional. Flag which enables/disables __HTTPHealthCheck__.
            Defaults to _false_.
          format: boolean
          type: boolean
        https:
          description: |-
            Optional. Flag which enables Hypertext Transfer Protocol Secure (HTTPS) in a health check.
            Defaults to _false_.
          format: boolean
          type: boolean
        id:
          description: The resource identifier.
          readOnly: true
          type: string
        interval:
          description: |-
            Optional. Interval value in seconds.
            The health check runs only for the specified interval and it is measured from the beginning of the previous check cycle.
            Defaults to _15_.
          format: int64
          type: integer
        metadata:
          $ref: '#/components/schemas/dtcMetadata'
        name:
          description: Display name of __HTTPHealthCheck__.
          type: string
        port:

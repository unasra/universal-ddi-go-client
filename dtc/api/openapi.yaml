        - health_check_id: health_check_id
          name: name
          consolidated_health_check:
            designators:
            - dns_service_id: dns_service_id
              dns_service_name: dns_service_name
            - dns_service_id: dns_service_id
              dns_service_name: dns_service_name
        name: name
        comment: comment
        disabled: true
        id: id
        server_health_checks_quorum: 6
      properties:
        comment:
          description: Optional. Comment for __Pool__.
          type: string
        consolidated_health_enabled:
          description: |-
            Optional. Pool-level switch that enables consolidated health probing for this __Pool__.

            Defaults to _false_ (consolidated health disabled). Set to _true_ to enable
            consolidated probing on this __Pool__. When _false_, any per-__PoolHealthCheck__
            consolidation configuration is preserved in storage but suppressed at runtime.
          format: boolean
          type: boolean
        disabled:
          description: |-
            Optional. Flag which enables/disables __Pool__.

            Defaults to _false_.
          format: boolean
          type: boolean
        health_checks:
          description: |-
            Optional. List of __HealthCheck__ objects IDs assigned to __Pool__.

            Defaults to _empty_.
          items:
            $ref: '#/components/schemas/dtcPoolHealthCheck'
          type: array
        id:
          description: The resource identifier.
          readOnly: true
          type: string
        inheritance_sources:
          $ref: '#/components/schemas/dtcTTLInheritance'
        metadata:
          $ref: '#/components/schemas/dtcMetadata'
        method:
          description: |-
            Load balancing method used for selecting __Server__ assigned to __Pool__.

            Valid values are:
            * _round_robin_
            If the _round_robin_ load balancing method is selected, Universal DDI adjusts the response to a query in a sequential
            and circular manner, directing clients to pools.

            * _ratio_
            If _ratio_ load balancing method is selected, Universal DDI adjusts the response to a query so that clients
            are directed to pool using weighted round robin, a load-balancing pattern in which requests are distributed
            among several resources based on weight assigned to each resource. The distribution of responses over time will be
            equal for all available pools but the sequence of the responses won't be guaranteed.
            When equal weights are assigned for resources (pools) it effectively leads to basic round robin
            which directs clients to pools in sequential and circular manner.

            * _global_availability_
            If _global_availability_ load balancing method is selected clients are directed to the first server that is up
            in the _servers_ list.

            Defaults to _round_robin_.
          type: string
        name:
          description: Display name of __Pool__.
          type: string
        pool_availability:
          description: |-
            Optional. Pool Availability setting defines how __Pool__ health is calculated.

            Valid values are:
            * _all_
            If _all_ availability selected then __Pool__ is treated healthy when all pool's servers are healthy.
            * _quorum_
            If _quorum_ availability selected then __Pool__ is treated healthy when at least N pool's servers are healthy.
            N is configurable via the value from _pool_servers_quorum_ setting.
            * _any_
            If _any_ availability selected then __Pool__ is treated healthy when at least one pool's server is healthy.

            Defaults to _any_.
          type: string
        pool_servers_quorum:
          description: Pool Servers Quorum defines a minimal number of pool's healthy
            servers required for treating __Pool__ as healthy when Pool Availability
            is set to _quorum_.
          format: int64
          type: integer
        server_availability:
          description: |-
            Optional. Server Availability setting defines how __Server__ health is calculated.

            Valid values are:
            * _all_
            If _all_ availability selected then __Server__ is treated healthy when all pool's health checks are positive.
            * _quorum_
            If _quorum_ availability selected then __Server__ is treated healthy when at least N pool's health checks are positive.
            N is configurable via the value from _server_health_checks_quorum_ setting.
            * _any_
            If _any_ availability selected then __Server__ is treated healthy when at least one pool's health check is positive

            Defaults to _all_.
          type: string
        server_health_checks_quorum:
          description: Server Health Checks Quorum defines a minimal number of pool's
            positive health checks required for treating __Server__ as healthy when
            Server Availability is set to _quorum_.
          format: int64
          type: integer
        servers:
          description: |-
            Optional. List of __Server__ objects assigned to __Pool__.

            Defaults to _empty_.
          items:
            $ref: '#/components/schemas/dtcPoolServer'
          type: array
        tags:
          additionalProperties: false
          description: Optional. The tags for __Pool__ in JSON format.
          type: object
        ttl:
          description: |-
            Optional. Time to live value (in seconds) to be used for records in DTC response.
            Unsigned integer, min: 0, max 2147483647 (31-bits per RFC-2181).
          format: int64
          type: integer
      required:
      - method
      - name
      title: Pool
      type: object

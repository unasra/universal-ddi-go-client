    dtcSIPHealthCheck:
      description: A __SIPHealthCheck__ (_dtc/health_check_sip_) represents a DTC
        __Server__ health check that probes a Session Initiation Protocol (SIP) endpoint
        by sending a SIP OPTIONS request over TCP or UDP.
      example:
        metadata:
          used_by:
          - details:
              key: details
            id: id
            display_name: display_name
          - details:
              key: details
            id: id
            display_name: display_name
        transport: transport

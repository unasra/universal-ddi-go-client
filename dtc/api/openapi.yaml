        retry_up: 5
      properties:
        comment:
          description: Optional. Comment for __SIPHealthCheck__.
          type: string
        disabled:
          description: |-
            Optional. Flag which enables/disables __SIPHealthCheck__.
            Defaults to _false_.
          format: boolean
          type: boolean
        id:
          description: The resource identifier.
          readOnly: true
          type: string
        interval:
          description: |-
            Optional. Interval value in seconds.
            The health check runs only for the specified interval and it is measured from the beginning of the previous check cycle.
            Defaults to _15_.
          format: int64
          type: integer
        metadata:
          $ref: '#/components/schemas/dtcMetadata'
        name:
          description: Display name of __SIPHealthCheck__.
          type: string
        port:
          description: |-
            Optional. Destination port for the SIP OPTIONS request.
            Defaults to _5060_ for both TCP and UDP transport.
          format: int64
          type: integer
        result_code:
          description: |-
            Optional. Expected SIP response code, used with _CODE_IS_ and _CODE_IS_NOT_ result modes.
            Defaults to _200_.
          format: int64
          type: integer
        result_mode:
          description: |-
            Optional. Defines how the SIP response code is evaluated.
            Supported values: _ANY_, _CODE_IS_, _CODE_IS_NOT_.
            Defaults to _CODE_IS_.
          type: string
        retry_down:
          description: |-
            Optional. Retry down count.
            The value determines how many bad health checks in a row must be received by the onprem host from the DTC Server
            for treating the health check as failed.
            Defaults to _1_.
          format: int64
          type: integer
        retry_up:
          description: |-
            Optional. Retry up count.
            The value determines how many good health checks in a row must be received by the onprem host from the DTC Server
            for treating the health check as successful.
            Defaults to _1_.
          format: int64
          type: integer
        tags:
          additionalProperties: false
          description: Optional. The tags for __SIPHealthCheck__ in JSON format.
          type: object
        timeout:
          description: |-
            Optional. Timeout value in seconds.
            The health check waits for the specified number of seconds after sending a request.
            If it does not receive a response within the number of seconds, then the health check is considered as failed.
            Defaults to _10_.
          format: int64
          type: integer
        transport:
          description: |-
            Optional. Transport protocol for the SIP OPTIONS request.
            Supported values: _TCP_, _UDP_.
            Defaults to _TCP_.
          type: string
      required:
      - name
      title: SIPHealthCheck
      type: object

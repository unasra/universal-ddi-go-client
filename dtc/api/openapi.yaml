    dtcPDPHealthCheck:
      description: A __PDPHealthCheck__ (_dtc/health_check_pdp_) represents a DTC
        __Server__ health check that probes a Packet Data Protocol (PDP) endpoint
        by exchanging a GTPv1 Echo Request/Response over UDP.
      example:
        metadata:
          used_by:
          - details:
              key: details
            id: id
            display_name: display_name
          - details:
              key: details
            id: id
            display_name: display_name
        port: 6
        name: name
        comment: comment
        disabled: true
        interval: 0
        id: id
        retry_down: 1
        retry_up: 5
        timeout: 5
        tags: "{}"
      properties:
        comment:
          description: Optional. Comment for __PDPHealthCheck__.
          type: string
        disabled:
          description: |-
            Optional. Flag which enables/disables __PDPHealthCheck__.
            Defaults to _false_.
          format: boolean
          type: boolean
        id:
          description: The resource identifier.
          readOnly: true
          type: string
        interval:
          description: |-
            Optional. Interval value in seconds.
            The health check runs only for the specified interval and it is measured from the beginning of the previous check cycle.
            Defaults to _15_.
          format: int64
          type: integer
        metadata:
          $ref: '#/components/schemas/dtcMetadata'
        name:
          description: Display name of __PDPHealthCheck__.
          type: string
        port:
          description: |-
            Optional. Destination UDP port of __PDPHealthCheck__ for the GTP Echo Request.
            Defaults to _2123_.
          format: int64
          type: integer
        retry_down:
          description: |-
            Optional. Retry down count.
            The value determines how many bad health checks in a row must be received by the onprem host from the DTC Server
            for treating the health check as failed.
            Defaults to _1_.
          format: int64
          type: integer
        retry_up:
          description: |-
            Optional. Retry up count.
            The value determines how many good health checks in a row must be received by the onprem host from the DTC Server
            for treating the health check as successful.
            Defaults to _1_.
          format: int64
          type: integer
        tags:
          additionalProperties: false
          description: Optional. The tags for __PDPHealthCheck__ in JSON format.
          type: object
        timeout:
          description: |-
            Optional. Timeout value in seconds.
            The health check waits for the specified number of seconds after sending a request.
            If it does not receive a response within the number of seconds, then the health check is considered as failed.
            Defaults to _10_.
          format: int64
          type: integer
      required:
      - name
      title: PDPHealthCheck
      type: object
    dtcPolicy:
      description: A __Policy__ (_dtc/policy_) represents a DNS load balancing policy.
      example:
        inheritance_sources:
          ttl:
            action: action
            source: source
            display_name: display_name
            value: 0
        metadata:
          used_by:
          - details:
              key: details
            id: id
            display_name: display_name
          - details:
              key: details
            id: id
            display_name: display_name
        method: method
        name: name
        pools:
        - name: name
          weight: 6
          pool_id: pool_id
        - name: name
          weight: 6
          pool_id: pool_id
        comment: comment
        disabled: true
        rules:
        - topology_id: topology_id
          code: code
          destination: destination
          name: name
          subnets:
          - subnets
          - subnets
          source: source
          pool_id: pool_id
          tag_rules:
          - op: op
            value: value
            key: key
          - op: op
            value: value
            key: key
        - topology_id: topology_id
          code: code
          destination: destination
          name: name
          subnets:
          - subnets
          - subnets
          source: source
          pool_id: pool_id
          tag_rules:
          - op: op
            value: value
            key: key
          - op: op
            value: value
            key: key
        id: id
        ttl: 1
        tags: "{}"
      properties:
        comment:
          description: Optional. Comment for __Policy__.
          type: string
        disabled:
          description: |-
            Optional. Flag which enables/disables __Policy__.

            Defaults to _false_.
          format: boolean
          type: boolean
        id:
          description: The resource identifier.
          readOnly: true
          type: string
        inheritance_sources:
          $ref: '#/components/schemas/dtcTTLInheritance'
        metadata:
          $ref: '#/components/schemas/dtcMetadata'
        method:
          description: |-
            Load balancing method used for selecting __Pool__ assigned to __Policy__.

            Valid values are:
            * _round_robin_
            If the _round_robin_ load balancing method is selected, Universal DDI adjusts the response to a query in a sequential
            and circular manner, directing clients to pools.

            * _ratio_
            If _ratio_ load balancing method is selected, Universal DDI adjusts the response to a query so that clients
            are directed to pool using weighted round robin, a load-balancing pattern in which requests are distributed
            among several resources based on weight assigned to each resource. The distribution of responses over time will be
            equal for all available pools but the sequence of the responses won't be guaranteed.
            When equal weights are assigned for resources (pools) it effectively leads to basic round robin configuration
            which directs clients to pools in a sequential and circular manner.

            * _topology_
            If _topology_ load balancing method is selected the pools configured for the policy are ignored and topology rules
            are used instead.

            * _global_availability_
            If _global_availability_ load balancing method is selected clients are directed to the first pool that is up
            in the _pools_ list.

            Defaults to _round_robin_.
          type: string
        name:
          description: Display name of __Policy__.
          type: string
        pools:
          description: |-
            Optional. List of __Pool__ objects assigned to __Policy__.

            Defaults to _empty_.
          items:
            $ref: '#/components/schemas/dtcPolicyPool'
          type: array
        rules:
          description: |-
            Optional. List of inline __TopologyRule__ objects defining the resolving strategy
            for __Policy__.

            Defaults to a list of single, default __TopologyRule__.
          items:
            $ref: '#/components/schemas/dtcTopologyRule'
          type: array
        tags:
          additionalProperties: false
          description: Optional. The tags for __Policy__ in JSON format.
          type: object
        ttl:
          description: |-
            Optional. Time to live value (in seconds) to be used for records in DTC response.
            Unsigned integer, min: 0, max 2147483647 (31-bits per RFC-2181).
          format: int64
          type: integer
      required:
      - method
      - name
      title: Policy
      type: object

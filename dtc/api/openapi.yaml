    SNMPHealthCheckEntryCheck:
      description: Specific check for an SNMP entry and its value in MIB hierarchy.
      example:
        name: name
        comment: comment
        type: type
        value: value
        operator: operator
        max_value: max_value
      properties:
        comment:
          description: Optional. Comment for __EntryCheck__.
          type: string
        max_value:
          description: "Optional. Expected max value of an entry to check against.\
            \ Used for __in__ operator only, otherwise ignored."
          type: string
        name:
          description: Name is a dotted-decimal number that defines the location of
            the entry in the universal MIB tree.
          type: string
        operator:
          description: |-
            Operator defines operation to perform on an entry value.

            Allowed values:
            * any - any value must be present
            * eq  - entry value must be equal to check's __value__.
            * leq - entry value must less or equal to check's __value__.
            * geq - entry value must be great or equal to check's __value__.
            * in  - entry value must be greater or equal than __value__ and less or equal than __max_value__.

            Operator __in__ is supported only for __integer__ types.
          type: string
        type:
          description: |-
            Type defines type of an entry value.

            Allowed values:
            * string
            * integer

            String type does not support __in__ operator.
          type: string
        value:
          description: Optional. Expected value of an entry to check against. Ignored
            for __any__ operator.
          type: string
      required:
      - name
      - operator
      - type
      title: EntryCheck
      type: object
    dtcConsolidatedHealthCheck:
      description: "When set, the DNS server running the named designator __DNS Service__\
        \ performs the health check on behalf of the __Pool__, and the result is shared\
        \ with other DNS servers linked to the __Pool__ via __LBDN__ association.\
        \ When unset, each DNS server performs the health check independently and\
        \ no health status is shared."
      example:
        designators:
        - dns_service_id: dns_service_id
          dns_service_name: dns_service_name
        - dns_service_id: dns_service_id
          dns_service_name: dns_service_name
      properties:
        designators:
          description: |-
            Designator __DNS Service__ references where the corresponding health checks will be associated to.
            Must contain at least one entry when set.

            On request: only _dns_service_id_ is honoured.
            On response: _dns_service_name_ is echoed alongside, resolved from inventory.
          items:
            $ref: '#/components/schemas/dtcDesignatorService'
          type: array
      title: ConsolidatedHealthCheck
      type: object

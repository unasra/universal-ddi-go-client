    dtcHTTPHealthCheck:
      description: A __HTTPHealthCheck__ (_dtc/health_check_http_) represents a DTC
        __Server__ health check based on the Hypertext Transfer Protocol (HTTP).
      example:
        codes: codes
        request: request
        metadata:
          used_by:
          - details:
              key: details
            id: id
            display_name: display_name
          - details:
              key: details
            id: id
            display_name: display_name
        check_response_body_negative: true
        check_response_body: true
